<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airbrakes V3 Telemetry</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#0d1b2c;--panel2:#12253b;--line:#24415f;--text:#ecf4fb;--muted:#91a7bf;--cyan:#57ddff;--green:#7fe6ad;--orange:#ffb66d;--pink:#ff79b7}*{box-sizing:border-box}body{margin:0;color:var(--text);font:14px Inter,system-ui,sans-serif;background:radial-gradient(1000px 520px at 8% -10%,#174568,#07111f 65%)}header{padding:26px max(22px,calc((100% - 1600px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:22px}h1{margin:0;font-size:clamp(23px,3vw,34px);letter-spacing:.08em}h1 i{color:var(--cyan);font-style:normal}p{margin:8px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}button,.file,select{color:var(--text);background:#132d48;border:1px solid #376386;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:650}.file:hover,button:hover,select:hover{border-color:var(--cyan)}input[type=file]{display:none}main{max-width:1600px;margin:auto;padding:18px 22px 50px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar select{min-width:280px}.badge{border-radius:999px;padding:7px 11px;font-weight:700;font-size:12px;background:#174634;color:var(--green)}.badge.flight{background:#4b331d;color:var(--orange)}.status{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--muted);background:#0d1b2cdd;border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:15px}.status b,.metric b{color:var(--cyan);font-variant-numeric:tabular-nums}.summary{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:9px;margin-bottom:18px}.metric{background:linear-gradient(145deg,#142c47,#0e2035);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:72px}.metric label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}.metric b{font-size:16px}.slider{display:flex;gap:10px;align-items:center;color:var(--muted);margin:0 0 15px}input[type=range]{width:280px;accent-color:var(--cyan)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;background:linear-gradient(145deg,#12253bfa,#0b1b2dfa);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:0 10px 35px #0002}.card.hot{border-color:#3a7791}.title{display:flex;justify-content:space-between;gap:10px}.title h2{font-size:14px;letter-spacing:.05em;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.plot{height:320px}.drop{outline:2px dashed var(--cyan);outline-offset:-7px}@media(max-width:1100px){.summary{grid-template-columns:repeat(4,1fr)}}@media(max-width:850px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}}@media(max-width:560px){main{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.plot{height:290px}}
</style></head><body>
<header><div><h1>AIRBRAKES <i>V3</i> / TELEMETRY</h1><p>Flight-data review Â· zoom, pan, hover, and inspect every sample</p></div><div class="actions"><label class="file">Import folder<input id="folderPicker" type="file" webkitdirectory directory multiple accept=".csv,text/csv"></label><label class="file">Import CSV<input id="csvPicker" type="file" accept=".csv,text/csv"></label><button id="reset">Reset views</button></div></header>
<main id="shell"><div class="toolbar"><select id="fileSelect" aria-label="Select imported log"><option>No logs imported</option></select><span id="kind" class="badge">No log loaded</span></div><div class="status"><span id="message">Import a flight-data folder to begin</span><span>Rows <b id="rows">â€”</b></span><span>Duration <b id="duration">â€”</b></span></div><section class="summary" id="summary"></section><div class="slider">Visible time <input id="timeWindow" type="range" min="1" max="100" value="100"><span id="windowLabel">100%</span><span>Â· double-click a graph to reset Â· drag to zoom</span></div><section class="grid" id="charts"></section></main>
<script>
const specs=[['01 Â· ALTITUDE','Filtered altitude vs raw barometer',[['altitude_m','Filtered','#57ddff'],['raw_baro_m','Raw barometer','#ffb66d']],'m'],['02 Â· VELOCITY','Estimated vertical velocity',[['velocity_ms','Velocity','#7fe6ad']],'m/s'],['03 Â· ACCELERATION','Raw, gravity-removed vertical, and bias',[['raw_accel_ms2','Raw','#ffb66d'],['vertical_accel_ms2','Vertical','#57ddff'],['accel_bias_ms2','Bias estimate','#ff79b7']],'m/sÂ²'],['04 Â· MOTOR POSITION','Actual actuator position vs command',[['motor_pos','Actual','#57ddff'],['motor_cmd_pos','Commanded','#ffb66d']],'position'],['05 Â· MOTOR VELOCITY','Actuator slew rate',[['motor_vel','Motor velocity','#7fe6ad']],'position/s'],['06 Â· CD TRACKING','Actual drag coefficient vs desired',[['Cd','Actual Cd','#57ddff'],['desired_Cd','Desired Cd','#ffb66d']],'Cd'],['07 Â· ORIENTATION','Roll, pitch, and yaw',[['roll_rad','Roll','#57ddff'],['pitch_rad','Pitch','#ffb66d'],['yaw_rad','Yaw','#7fe6ad']],'rad'],['08 Â· POWER','Motor current and battery voltage',[['motor_current','Current','#ff79b7'],['battery_voltage','Voltage','#57ddff']],'A / V'],['09 Â· TRACKING ERRORS','Command minus actual',[['motor_error','Motor position error','#ff79b7'],['cd_error','Cd error','#ffb66d']],'error'],['10 Â· PHASE PORTRAIT','Motor position vs velocity, colored by time',null,'position / position/s']];
let logs=[],data=null,plots=[];const $=id=>document.getElementById(id);function num(v){if(v==null)return NaN;let s=String(v).trim().replace(/^\uFEFF/,'').replace(/[\u2018\u2019']/g,'').replace(/^"+|"+$/g,'').replace(/\s/g,'');if(!s||/^(na|nan|null|none|undefined)$/i.test(s))return NaN;let n=Number(s);return Number.isFinite(n)?n:NaN}function rowsOf(t){let out=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i];if(x==='"'){if(q&&t[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&t[i+1]==='\n')i++;r.push(c);if(r.some(v=>v.trim()))out.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);out.push(r)}return out}function parse(t,name){let rs=rowsOf(t),heads=rs.shift().map(x=>x.trim().replace(/^'+|'+$/g,'')),rec=rs.map(r=>Object.fromEntries(heads.map((h,i)=>[h,r[i]??'']))),col=k=>rec.map(r=>num(r[k])),time=col('time_ms').map(x=>x/1000);let d={name,rec,col,time,duration:time.filter(Number.isFinite).at(-1)||0};d.motor_error=rec.map(r=>num(r.motor_cmd_pos)-num(r.motor_pos));d.cd_error=rec.map(r=>num(r.desired_Cd)-num(r.Cd));d.kind=/ground|test/i.test(name)||rec.some(r=>/GROUND_TEST/i.test(r.state_name||''))?'Ground test':'Flight';return d}
function finite(a){return a.filter(Number.isFinite)}function range(a){let x=finite(a);return x.length?`${Math.min(...x).toFixed(3)} â€“ ${Math.max(...x).toFixed(3)}`:'â€”'}function summary(d){let alt=finite(d.col('altitude_m')),vel=finite(d.col('velocity_ms')),bat=finite(d.col('battery_voltage')),cd=finite(d.col('Cd')),apogee=alt.length?Math.max(...alt):NaN,apogeeIndex=d.col('altitude_m').indexOf(apogee),peakVel=vel.length?Math.max(...vel.map(Math.abs)):NaN;let sample=d.time.length>1?(d.time.at(-1)-d.time[0])/(d.time.length-1):NaN;let toApogee=apogeeIndex>=0?d.time[apogeeIndex]:NaN;let items=[['Duration',d.duration.toFixed(3)+' s'],['Max altitude / apogee',Number.isFinite(apogee)?apogee.toFixed(3)+' m':'â€”'],['Max |velocity|',Number.isFinite(peakVel)?peakVel.toFixed(3)+' m/s':'â€”'],['Battery range',range(bat)+' V'],['Sample rate',Number.isFinite(sample)&&sample>0?(1/sample).toFixed(1)+' Hz':'â€”'],['Time to apogee',Number.isFinite(toApogee)?toApogee.toFixed(3)+' s':'â€”'],['Cd range',range(cd)],['Data rows',d.time.length.toLocaleString()]];$('summary').innerHTML=items.map(x=>`<div class="metric"><label>${x[0]}</label><b>${x[1]}</b></div>`).join('')}
function trace(k,n,c){let rawY=k==='motor_error'?data.motor_error:k==='cd_error'?data.cd_error:data.col(k),x=[],y=[];for(let i=0;i<Math.min(data.time.length,rawY.length);i++)if(Number.isFinite(data.time[i])&&Number.isFinite(rawY[i])){x.push(data.time[i]);y.push(rawY[i])}return{x,y,type:'scattergl',mode:'lines',name:n,line:{color:c,width:1.45},connectgaps:false,hovertemplate:`%{x:.4f} s<br>${n}: %{y:.8g}<extra></extra>`}}function traces(s){if(!s[2]){let x=[],y=[],t=[];let px=data.col('motor_pos'),py=data.col('motor_vel');for(let i=0;i<data.time.length;i++)if(Number.isFinite(px[i])&&Number.isFinite(py[i])){x.push(px[i]);y.push(py[i]);t.push(data.time[i])}return[{x,y,type:'scattergl',mode:'markers',marker:{size:4,color:t,colorscale:'Turbo',showscale:true,colorbar:{title:'s'}},customdata:t,hovertemplate:'position: %{x:.8g}<br>velocity: %{y:.8g}<br>time: %{customdata:.4f} s<extra></extra>'}]}return s[2].map(x=>trace(...x))}function draw(){let root=$('charts');root.innerHTML='';plots=[];specs.forEach((s,i)=>{let card=document.createElement('article');card.className='card'+([3,5,8].includes(i)?' hot':'');card.innerHTML=`<div class="title"><h2>${s[0]}</h2><span class="sub">${[3,5,8].includes(i)?'ACTIONABLE':''}</span></div><div class="sub">${s[1]}</div><div class="plot" id="p${i}"></div>`;root.append(card);Plotly.newPlot(`p${i}`,traces(s),{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#b8c9dc',size:11},margin:{l:54,r:18,t:10,b:42},legend:{orientation:'h',y:1.12},hovermode:i===9?'closest':'x unified',xaxis:{title:i===9?'Motor position':'Time (s)',gridcolor:'#24415f',zerolinecolor:'#31516f'},yaxis:{title:s[3],gridcolor:'#24415f',zerolinecolor:'#31516f'},uirevision:'telemetry'},{responsive:true,scrollZoom:true,displaylogo:false,modeBarButtonsToRemove:['lasso2d','select2d']}).then(g=>plots.push(g)).catch(e=>{$('message').textContent=`Chart ${i+1} failed: ${e.message}`;})})}
function show(i){data=logs[i];$('message').textContent=data.name;$('rows').textContent=data.time.length.toLocaleString();$('duration').textContent=data.duration.toFixed(3)+' s';$('kind').textContent=data.kind;$('kind').className='badge '+(data.kind==='Flight'?'flight':'');summary(data);$('timeWindow').value=100;$('windowLabel').textContent='100%';draw()}function add(file){let r=new FileReader();r.onload=()=>{try{logs.push(parse(r.result,file.webkitRelativePath||file.name));let o=document.createElement('option');o.value=logs.length-1;o.textContent=file.webkitRelativePath||file.name;$('fileSelect').append(o);if(logs.length===1)show(0)}catch(e){$('message').textContent='Could not parse '+file.name+': '+e.message}};r.readAsText(file)}
function importFiles(files){[...files].filter(f=>/\.csv$/i.test(f.name)).forEach(add)}$('folderPicker').onchange=e=>importFiles(e.target.files);$('csvPicker').onchange=e=>importFiles(e.target.files);$('fileSelect').onchange=e=>show(Number(e.target.value));$('reset').onclick=()=>plots.forEach(g=>Plotly.relayout(g,{'xaxis.autorange':true,'yaxis.autorange':true}));$('timeWindow').oninput=e=>{let end=data.duration*Number(e.target.value)/100;$('windowLabel').textContent=e.target.value+'%';plots.forEach(g=>Plotly.relayout(g,{'xaxis.range':[0,end]}))};$('shell').ondragover=e=>{e.preventDefault();$('shell').classList.add('drop')};$('shell').ondragleave=()=>$('shell').classList.remove('drop');$('shell').ondrop=e=>{e.preventDefault();$('shell').classList.remove('drop');importFiles(e.dataTransfer.files)};
fetch('data_manifest.json').then(r=>r.ok?r.json():Promise.reject()).catch(()=>['data.csv']).then(names=>Promise.all(names.map(name=>fetch(name).then(r=>r.text().then(t=>({name,t})))))).then(items=>{items.forEach(item=>{logs.push(parse(item.t,item.name));let o=document.createElement('option');o.value=logs.length-1;o.textContent=item.name;$('fileSelect').append(o)});if(logs.length)show(0)}).catch(()=>{});
</script></body></html>
